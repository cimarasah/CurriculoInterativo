<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir Senha - Currículo Interativo</title>
    <link rel="stylesheet" href="css/auth.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
        }
        .reset-container {
            background: white;
            border-radius: 12px;
            padding: 40px;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }
        .reset-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .reset-header h1 {
            color: #667eea;
            margin: 0 0 10px 0;
        }
        .reset-header p {
            color: #7f8c8d;
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="reset-container">
        <div class="reset-header">
            <h1><i class="fas fa-lock"></i> Redefinir Senha</h1>
            <p>Digite sua nova senha abaixo</p>
        </div>
        <form id="reset-password-form">
            <div class="form-group">
                <label for="new-password">Nova Senha *</label>
                <input type="password" id="new-password" class="form-control" placeholder="Mínimo 6 caracteres" required minlength="6">
            </div>
            <div class="form-group">
                <label for="confirm-password">Confirmar Nova Senha *</label>
                <input type="password" id="confirm-password" class="form-control" placeholder="Digite a senha novamente" required minlength="6">
            </div>
            <div id="reset-error" class="error-message" style="display: none;"></div>
            <div id="reset-success" style="display: none; padding: 15px; background-color: #d4edda; border: 1px solid #c3e6cb; border-radius: 5px; margin-bottom: 15px; color: #155724;">
                <i class="fas fa-check-circle"></i> Senha redefinida com sucesso! Redirecionando para login...
            </div>
            <button type="submit" class="btn-submit">
                <i class="fas fa-save"></i> Redefinir Senha
            </button>
        </form>
        <div class="modal-loading" id="reset-loading" style="display: none;">
            <i class="fas fa-spinner fa-spin"></i> Redefinindo senha...
        </div>
        <div style="text-align: center; margin-top: 20px;">
            <a href="index.html" style="color: #667eea; text-decoration: none;">
                <i class="fas fa-arrow-left"></i> Voltar para o site
            </a>
        </div>
    </div>

    <script>
        const API_BASE_URL = window.location.origin + '/api';
        
        // Obter token da URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        if (!token) {
            document.getElementById('reset-password-form').innerHTML = `
                <div class="error-message">
                    <i class="fas fa-exclamation-triangle"></i> Token inválido ou ausente. 
                    <a href="index.html" style="color: #667eea;">Solicite uma nova recuperação de senha</a>.
                </div>
            `;
        }

        document.getElementById('reset-password-form')?.addEventListener('submit', async function(e) {
            e.preventDefault();

            const newPassword = document.getElementById('new-password')?.value;
            const confirmPassword = document.getElementById('confirm-password')?.value;
            const errorDiv = document.getElementById('reset-error');
            const successDiv = document.getElementById('reset-success');
            const loadingDiv = document.getElementById('reset-loading');
            const submitBtn = e.target.querySelector('button[type="submit"]');

            if (!newPassword || !confirmPassword) {
                if (errorDiv) {
                    errorDiv.textContent = 'Por favor, preencha todos os campos.';
                    errorDiv.style.display = 'block';
                }
                return;
            }

            if (newPassword !== confirmPassword) {
                if (errorDiv) {
                    errorDiv.textContent = 'As senhas não coincidem.';
                    errorDiv.style.display = 'block';
                }
                return;
            }

            if (newPassword.length < 6) {
                if (errorDiv) {
                    errorDiv.textContent = 'A senha deve ter pelo menos 6 caracteres.';
                    errorDiv.style.display = 'block';
                }
                return;
            }

            if (!token) {
                if (errorDiv) {
                    errorDiv.textContent = 'Token inválido. Solicite uma nova recuperação de senha.';
                    errorDiv.style.display = 'block';
                }
                return;
            }

            // Mostrar loading
            if (loadingDiv) loadingDiv.style.display = 'flex';
            if (errorDiv) errorDiv.style.display = 'none';
            if (successDiv) successDiv.style.display = 'none';
            if (submitBtn) {
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Redefinindo...';
            }

            try {
                const response = await fetch(`${API_BASE_URL}/auth/reset-password-with-token`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        token: token,
                        newPassword: newPassword,
                        confirmPassword: confirmPassword
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || 'Erro ao redefinir senha');
                }

                // Sucesso
                if (successDiv) successDiv.style.display = 'block';
                if (e.target) e.target.style.display = 'none';

                // Redirecionar para login após 3 segundos
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 3000);

            } catch (error) {
                console.error('Erro ao redefinir senha:', error);
                if (errorDiv) {
                    errorDiv.textContent = error.message || 'Erro ao redefinir senha. Verifique se o token ainda é válido.';
                    errorDiv.style.display = 'block';
                }
            } finally {
                if (loadingDiv) loadingDiv.style.display = 'none';
                if (submitBtn) {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<i class="fas fa-save"></i> Redefinir Senha';
                }
            }
        });
    </script>
</body>
</html>
