name: Deploy ASP.NET Core to Azure App Service

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: curriculo-interativo-api    # ⚠️ ALTERE PARA O NOME DO SEU APP SERVICE
  DOTNET_VERSION: '8.0.x'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore
      working-directory: ./CurriculoInterativo.Api

    - name: Build
      run: dotnet build --configuration Release --no-restore
      working-directory: ./CurriculoInterativo.Api

    - name: Publish
      run: dotnet publish -c Release -o ./output
      working-directory: ./CurriculoInterativo.Api

    - name: Deploy to Azure Web App
      id: deploy-to-webapp
      uses: azure/webapps-deploy@v2
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: ./CurriculoInterativo.Api/output

